# Application Configuration
spring.application.name=Banking System
server.port=8080

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_system
spring.data.mongodb.authentication-database=admin

# Logging Configuration
logging.level.com.yourcompany.bankingsystem=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.transaction=DEBUG

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Transaction Configuration
spring.transaction.default-timeout=30

# Security Configuration (disable for console app)
spring.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Profile Configuration
spring.profiles.active=local

# Custom Banking Configuration
banking.minimum.balance.sb=1000.0
banking.minimum.balance.ca=5000.0
banking.transaction.queue.size=1000
banking.transaction.stack.size=1000
banking.settlement.cron=0 2 * * * ?

# Audit Configuration
banking.audit.enabled=true
banking.audit.retention.days=365

# Performance Configuration
spring.jpa.show-sql=false
spring.data.mongodb.repositories.enabled=true
