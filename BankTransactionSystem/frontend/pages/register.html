<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Customer Registration</h1>
            <button class="back-btn" onclick="location.href='../index.html'">← Back to Main Menu</button>
        </div>

        <div class="form-container">
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="fullName">Enter your full Name:</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Enter your email:</label>
                    <input type="email" id="email" name="email" required placeholder="john.doe@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Choose your password:</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="********">
                    <small>Password must be at least 6 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Choose your password again:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="********">
                </div>

                <button type="submit" class="submit-btn">Register</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
