<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Transfer Money</title>
    <link rel="stylesheet" href="../css/style.css?v=5">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Transfer Money</h1>
            <button class="back-btn" onclick="location.href='customer-dashboard.html'">← Back to Dashboard</button>
        </div>

        <div class="content">
            <div id="accountsList" class="accounts-list"></div>
            
            <div class="form-container" id="transferForm" style="display: none;">
                <p class="info-message">Amount will be debited from: <strong id="selectedAccount"></strong></p>
                
                <form onsubmit="handleTransfer(event)">
                    <div class="form-group">
                        <label for="toAccount">Enter to account number:</label>
                        <input type="text" id="toAccount" name="toAccount" 
                               required placeholder="1234567890123">
                    </div>

                    <div class="form-group">
                        <label for="amount">Enter amount to transfer:</label>
                        <input type="number" id="amount" name="amount" 
                               required min="1" step="0.01" placeholder="1000.00">
                    </div>

                    <div class="form-group" style="background: #fff3e0; padding: 15px; border-radius: 8px; border: 2px solid #ff9800; margin-top: 20px;">
                        <label for="password" style="color: #e65100; font-weight: bold; font-size: 1.1em;">
                            🔒 Enter your password to confirm transfer:
                        </label>
                        <input type="password" id="password" name="password" 
                               required placeholder="Enter your password" 
                               autocomplete="current-password"
                               style="margin-top: 10px; border: 2px solid #ff9800; font-size: 1em; padding: 12px;">
                        <small style="color: #e65100; font-size: 0.9em; display: block; margin-top: 8px; font-weight: 600;">
                            ⚠️ Password is required for security verification
                        </small>
                    </div>

                    <button type="submit" class="submit-btn">Transfer Money</button>
                </form>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="../js/main.js?v=6"></script>
    <script src="../js/transfer.js?v=6"></script>
</body>
</html>
