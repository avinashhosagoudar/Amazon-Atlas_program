<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Money</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Deposit Money</h1>
            <button class="back-btn" onclick="location.href='customer-dashboard.html'">← Back to Dashboard</button>
        </div>

        <div class="content">
            <div id="accountsList" class="accounts-list"></div>
            
            <div class="form-container" id="depositForm" style="display: none;">
                <form onsubmit="handleDeposit(event)">
                    <div class="form-group">
                        <label for="amount">Enter amount to deposit:</label>
                        <input type="number" id="amount" name="amount" 
                               required min="1" step="0.01" placeholder="1000.00">
                    </div>

                    <button type="submit" class="submit-btn">Deposit</button>
                </form>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="../js/main.js?v=2"></script>
    <script src="../js/deposit.js?v=2"></script>
</body>
</html>
